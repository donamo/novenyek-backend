services:
  backend:
    build:
      context: .
    image: novenyek-backend:latest
    container_name: novenyek_backend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - VIRTUAL_HOST=${VIRTUAL_HOST:-novenyek-api.donamo.science}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-novenyek-api.donamo.science}
      - VIRTUAL_PORT=3000
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const s=net.connect(3000,'127.0.0.1');s.setTimeout(2000);s.on('connect',()=>{s.destroy();process.exit(0)});s.on('timeout',()=>process.exit(1));s.on('error',()=>process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: nginx-proxy
    external: true

volumes:
  uploads_data:
